# =============================================================
# Documentação: constrói o site MkDocs em modo estrito
# =============================================================
# Roda só em Pull Requests que mexem na documentação (e quando alguém pede,
# em "Run workflow"). NÃO roda em push na main, então não participa do
# "After CI Checks Pass" do Render e nunca atrasa a publicação do chatbot.
#
# NÃO publica no GitHub Pages: isso depende de autorização da dona do
# repositório (veja docs/publicar.md). O site gerado fica só como artefato
# desta execução (aba Actions → Summary → Artifacts), por 7 dias.
# Não usa segredos.
# =============================================================

name: Documentação (MkDocs)

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Instalar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Instalar o MkDocs e o tema Material
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt
          pip check

      # --strict: qualquer aviso (link quebrado, âncora inexistente, página
      # fora do menu) deixa o job vermelho.
      - name: Construir o site (mkdocs build --strict)
        run: mkdocs build --strict

      - name: Guardar o site gerado
        uses: actions/upload-artifact@v4
        with:
          name: site-documentacao
          path: site/
          retention-days: 7
