# =============================================================
# Validação REAL do pipeline e do dashboard com a API do IBGE
# =============================================================
# Roda só em Pull Requests que mexem no pipeline ou no dashboard (e quando alguém pede, em
# "Run workflow"). NÃO roda em push na main, então não participa do
# "After CI Checks Pass" do Render e nunca atrasa a publicação do chatbot.
#
# Ele acessa a internet de verdade (API pública do IBGE, sem chave):
# por isso fica separado do job "testar", que nunca depende de serviços externos.
# Não usa segredos e não publica nada: as fotos do dashboard ficam só como
# artefato desta execução (aba Actions → Summary → Artifacts).
# =============================================================

name: Validação real da API do IBGE

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "dashboard/**"
      - ".streamlit/**"
      - "scripts/conferir_dashboard.py"
      - "requirements-dados.txt"
      - ".github/workflows/api-ibge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-ibge:
    name: api-ibge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Instalar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dados.txt

      - name: Instalar as bibliotecas do pipeline e do dashboard
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dados.txt
          pip check

      # Um único download: o pipeline guarda a cópia em dados/ e o dashboard a reaproveita.
      - name: Rodar o pipeline com a API real do IBGE
        run: python -m pipeline --cache dados/ibge_4714_2022.json --csv dados/municipios.csv

      # Playwright só para as fotos (não entra em nenhum requirements*.txt).
      - name: Instalar o navegador para as fotos
        run: |
          pip install playwright==1.64.0
          python -m playwright install --with-deps chromium

      - name: Abrir o dashboard com os dados reais e tirar fotos
        run: python scripts/conferir_dashboard.py --fotos fotos

      - name: Guardar as fotos do dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotos-dashboard
          path: fotos/
          if-no-files-found: ignore
          retention-days: 7
