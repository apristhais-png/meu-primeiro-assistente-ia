# =============================================================
# Configuração central do projeto
# =============================================================
# - [project] e [tool.poetry.group.*]: as bibliotecas, para o Poetry.
# - [tool.pytest] / [tool.coverage]: testes e cobertura.
# - [tool.ruff]: estilo, erros comuns e formatação.
#
# O Render NÃO usa o Poetry: ele continua instalando o requirements.txt
# (veja render.yaml). As versões aqui são as MESMAS dos requirements*.txt e
# um teste (tests/test_poetry.py) confere que os dois lados não se separam:
#
#   requirements.txt        <->  [project] dependencies   (chatbot / Render)
#   requirements-dados.txt  <->  grupo "dados"            (pipeline + dashboard)
#   requirements-dev.txt    <->  grupo "dev"              (testes e Ruff)
#   requirements-docs.txt   <->  grupo "docs"             (site MkDocs)
#
# Para mudar uma versão: altere o requirements*.txt E este arquivo, depois
# rode "poetry lock" e confira com "pytest tests/test_poetry.py".
# =============================================================

[project]
name = "professor-de-dados"
version = "1.0.0"
description = "Professor de Dados (chatbot Gradio) e Brasil em Dados — Censo 2022 (pipeline IBGE + dashboard Streamlit)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "apristhais-png" }]
# Chatbot (Produto A): exatamente o requirements.txt que o Render instala.
dependencies = [
    "gradio==6.30.0",
    "pyyaml==6.0.3",
    "pydantic==2.14.0",
    "openai==3.28.0",
    "anthropic==1.13.0",
    "python-dotenv==1.2.4",
    "tzdata==2026.5",
]

[tool.poetry]
# É uma aplicação, não uma biblioteca para publicar: o Poetry só instala as
# dependências (não tenta empacotar as pastas do projeto).
package-mode = false

# Os grupos são opcionais: "poetry install" instala só o chatbot (o mesmo
# conjunto do Render); "poetry install --with dados,dev,docs" instala tudo.

# Pipeline do IBGE e dashboard (Produto B) = requirements-dados.txt.
# O pydantic já está nas dependências principais (mesma versão).
[tool.poetry.group.dados]
optional = true

[tool.poetry.group.dados.dependencies]
requests = "2.34.2"
pandas = "3.0.6"
streamlit = "1.66.0"
plotly = "7.1.0"

# Testes e qualidade = requirements-dev.txt.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-cov = "7.1.0"
httpx2 = "2.13.1"
huggingface-hub = "2.2.0"
ruff = "0.17.0"

# Site de documentação (MkDocs + Material) = requirements-docs.txt.
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "1.6.1"
mkdocs-material = "9.7.7"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

# ---------- Testes ----------

[tool.pytest.ini_options]
# Permite que os testes encontrem as pastas do projeto a partir da raiz.
pythonpath = ["."]
testpaths = ["tests"]

# ---------- Cobertura (pytest --cov) ----------

[tool.coverage.run]
# Módulos de dados e do dashboard: a CI exige pelo menos 80% deles.
source = ["pipeline", "dashboard"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

# ---------- Ruff (lint e formatação) ----------

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["dados", "site"]

[tool.ruff.lint]
# As regras são o conjunto padrão do Ruff 0.17 (já amplo: erros, bugs comuns,
# imports, modernização, simplificações e parte das regras de segurança).
# Nada foi desligado. Só acrescentamos:
extend-select = [
    "E501",  # linha longa demais (acima de 120 caracteres)
]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
